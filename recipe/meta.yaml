{% set name = "pytokens" %}
{% set version = "0.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 292052fe80923aae2260c073f822ceba21f3872ced9a68bb7953b348e561179a

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<38]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools >=69
    - wheel
    - mypy
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - pytokens
  requires:
    - pytest
    - pip
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/tusharsadhwani/pytokens
  dev_url: https://github.com/tusharsadhwani/pytokens
  doc_url: https://github.com/tusharsadhwani/pytokens/blob/main/README.md
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A fast, spec-compliant Python tokenizer"
  description: |
    A fast, spec-compliant Python tokenizer that runs on older Pythons.
